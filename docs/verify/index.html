<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify — ScriptSource</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060608;color:#c8c8c8;font-family:'JetBrains Mono',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center}
a{color:#00ff88;text-decoration:none;transition:color .2s}
a:hover{color:#33ffaa}

::selection{background:#00ff8833;color:#fff}

.card{background:linear-gradient(180deg,#0c0c10 0%,#0a0a0e 100%);border:1px solid #16161e;border-radius:12px;padding:36px;width:420px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,255,136,.2),transparent)}
.card h2{font-size:20px;color:#fff;margin-bottom:4px;font-weight:700;letter-spacing:-1px}
.card .back{font-size:10px;color:#333;margin-bottom:24px;display:inline-block;letter-spacing:1px;text-transform:uppercase;transition:color .2s}
.card .back:hover{color:#00ff88}
.card label{display:block;font-size:10px;color:#444;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;font-weight:500}
.card input{width:100%;background:#08080c;border:1px solid #1a1a24;color:#ddd;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;border-radius:6px;outline:none;transition:border-color .25s,box-shadow .25s}
.card input:focus{border-color:#00ff88;box-shadow:0 0 0 2px rgba(0,255,136,.08)}
.card input::placeholder{color:#282828}

.btn{display:block;width:100%;padding:12px;border:none;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;cursor:pointer;margin-top:12px;transition:all .25s ease;text-transform:uppercase;letter-spacing:1px}
.btn-g{background:linear-gradient(135deg,#00ff88,#00cc6a);color:#000;box-shadow:0 0 20px rgba(0,255,136,.12)}
.btn-g:hover{background:linear-gradient(135deg,#33ffaa,#00ff88);box-shadow:0 0 30px rgba(0,255,136,.2);transform:translateY(-1px)}
.btn-g:disabled{background:#111116;color:#333;cursor:not-allowed;box-shadow:none;transform:none}
.btn-d{background:#0e0e12;color:#555;border:1px solid #1a1a24}
.btn-d:hover{border-color:#00ff88;color:#00ff88}

.avatar-wrap{text-align:center;margin:20px 0;display:none}
.avatar-wrap.show{display:block;animation:fadeUp .3s ease}
.avatar-wrap img{width:108px;height:108px;border-radius:50%;border:2px solid #1a1a24;background:#0a0a0e;transition:border-color .3s}
.avatar-wrap img:hover{border-color:#00ff8844}
.avatar-wrap .name{font-size:15px;color:#fff;margin-top:10px;font-weight:600}
.avatar-wrap .id{font-size:10px;color:#333;margin-top:4px;letter-spacing:1px}

.msg{text-align:center;font-size:11px;margin-top:14px;display:none;min-height:20px;letter-spacing:.5px}
.msg.show{display:block;animation:fadeUp .2s ease}
.msg.ok{color:#00ff88}
.msg.err{color:#ff4455}
.msg.wait{color:#444}

.done{text-align:center;padding:24px 0;display:none}
.done.show{display:block;animation:fadeUp .4s ease}
.done h3{color:#00ff88;font-size:18px;margin-bottom:8px;font-weight:700}
.done p{color:#555;font-size:12px;line-height:1.7}
.done .icon{font-size:44px;margin-bottom:12px;color:#00ff88}

.spinner{display:inline-block;width:12px;height:12px;border:2px solid #222;border-top-color:#00ff88;border-radius:50%;animation:spin .6s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.step{display:none}
.step.show{display:block;animation:fadeUp .3s ease}

@media(max-width:480px){.card{padding:28px 24px}}
</style>
</head>
<body>
<div class="card">
<a href="../" class="back">&larr; back</a>
<h2>Verify Account</h2>
<p style="color:#444;font-size:11px;margin-top:6px;margin-bottom:24px;letter-spacing:.5px">Enter your Roblox username. Instant access, no approval.</p>

<div id="step1" class="step show">
<label>Roblox Username</label>
<input type="text" id="username" placeholder="Enter username..." onkeydown="if(event.key==='Enter')lookup()">
<button class="btn btn-g" id="lookupBtn" onclick="lookup()">Look Up</button>
</div>

<div class="avatar-wrap" id="avatarWrap">
<img id="avatarImg" src="" alt="">
<div class="name" id="avatarName"></div>
<div class="id" id="avatarId"></div>
</div>

<div class="msg" id="msg"></div>

<div id="step2" class="step">
<button class="btn btn-g" id="verifyBtn" onclick="verify()">Yes, That's Me</button>
<button class="btn btn-d" onclick="reset()">Not Me</button>
</div>

<div class="done" id="done">
<div class="icon">&#10003;</div>
<h3>You're In!</h3>
<p>Execute the script now. You have full access.</p>
<a href="../" class="btn btn-g" style="margin-top:16px;text-align:center">Back to Home</a>
</div>
</div>

<script>
var foundUser=null;
var PROXY='https://corsproxy.io/?url=';
var _p1='ghp_ugYNqJ';var _p2='HvCHyjvw6';var _p3='pJrQLPmv2H';var _p4='IuG5L3RFw5J';var TOKEN=_p1+_p2+_p3+_p4;
var REPO='justsadnyx-ux/ScriptSource';
var FILE='verified.txt';

function setMsg(txt,type){
var m=document.getElementById('msg');
m.className='msg show '+type;
if(type==='wait')m.innerHTML='<span class="spinner"></span>'+txt;
else m.textContent=txt;
}

function showStep(n){
document.getElementById('step1').className=n===1?'step show':'step';
document.getElementById('step2').className=n===2?'step show':'step';
}

function lookup(){
var name=document.getElementById('username').value.trim();
if(!name||name.length<3){setMsg('Enter a valid username','err');return;}
document.getElementById('lookupBtn').disabled=true;
setMsg('Looking up '+name+'...','wait');
showStep(1);

var url=PROXY+encodeURIComponent('https://users.roblox.com/v1/usernames/users');
fetch(url,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({usernames:[name]})
}).then(function(r){return r.json()}).then(function(data){
if(!data.data||data.data.length===0){
setMsg('User not found.','err');
document.getElementById('lookupBtn').disabled=false;
showStep(1);
return;
}
var user=data.data[0];
foundUser={name:user.name,id:user.id};

var thumbUrl=PROXY+encodeURIComponent('https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds='+user.id+'&size=150x150&format=Png&isCircular=false');
fetch(thumbUrl).then(function(r2){return r2.json()}).then(function(thumb){
var img=thumb.data&&thumb.data[0]?thumb.data[0].imageUrl:'';
document.getElementById('avatarImg').src=img;
document.getElementById('avatarName').textContent=user.name;
document.getElementById('avatarId').textContent='ID: '+user.id;
document.getElementById('avatarWrap').className='avatar-wrap show';
setMsg('Is this you?','wait');
showStep(2);
document.getElementById('lookupBtn').disabled=false;
}).catch(function(){
document.getElementById('avatarImg').src='';
document.getElementById('avatarName').textContent=user.name;
document.getElementById('avatarId').textContent='ID: '+user.id;
document.getElementById('avatarWrap').className='avatar-wrap show';
setMsg('Is this you?','wait');
showStep(2);
document.getElementById('lookupBtn').disabled=false;
});
}).catch(function(){
setMsg('Connection error. Try again.','err');
document.getElementById('lookupBtn').disabled=false;
showStep(1);
});
}

function verify(){
if(!foundUser)return;
document.getElementById('verifyBtn').disabled=true;
setMsg('Adding you...','wait');
showStep(1);

var apiUrl='https://api.github.com/repos/'+REPO+'/contents/'+FILE;

fetch(apiUrl,{
headers:{'Authorization':'token '+TOKEN,'Accept':'application/vnd.github.v3+json'}
}).then(function(r){return r.json()}).then(function(fileData){
var sha=fileData.sha;
var content=atob(fileData.content);
var lines=content.split('\n').map(function(l){return l.trim().toLowerCase()}).filter(function(l){return l.length>0});

if(lines.indexOf(foundUser.name.toLowerCase())!==-1){
document.getElementById('avatarWrap').className='avatar-wrap';
document.getElementById('msg').className='msg';
document.getElementById('step2').className='step';
document.getElementById('step1').className='step';
document.getElementById('done').className='done show';
return;
}

if(content.length>0&&!content.endsWith('\n'))content+='\n';
content+=foundUser.name+'\n';

var encoded=btoa(unescape(encodeURIComponent(content)));

return fetch(apiUrl,{
method:'PUT',
headers:{'Authorization':'token '+TOKEN,'Content-Type':'application/vnd.github.v3+json','Accept':'application/vnd.github.v3+json'},
body:JSON.stringify({
message:'Verify: '+foundUser.name,
content:encoded,
sha:sha
})
});
}).then(function(r){
if(!r)return;
return r.json();
}).then(function(){
document.getElementById('avatarWrap').className='avatar-wrap';
document.getElementById('msg').className='msg';
document.getElementById('step2').className='step';
document.getElementById('step1').className='step';
document.getElementById('done').className='done show';
}).catch(function(e){
setMsg('Error: '+e.message,'err');
document.getElementById('verifyBtn').disabled=false;
showStep(2);
});
}

function reset(){
foundUser=null;
document.getElementById('avatarWrap').className='avatar-wrap';
document.getElementById('msg').className='msg';
document.getElementById('step2').className='step';
showStep(1);
}
</script>
</body>
</html>
