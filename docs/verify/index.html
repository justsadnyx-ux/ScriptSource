<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify — ScriptSource</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#ddd;font-family:'JetBrains Mono',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center}
a{color:#00ff88;text-decoration:none}
.card{background:#111;border:1px solid #1e1e1e;border-radius:8px;padding:32px;width:400px;max-width:90vw}
.card h2{font-size:18px;color:#fff;margin-bottom:4px}
.card .back{font-size:11px;color:#444;margin-bottom:20px;display:block}
.card label{display:block;font-size:11px;color:#555;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.card input{width:100%;background:#080808;border:1px solid #222;color:#ddd;padding:10px 12px;font-family:'JetBrains Mono',monospace;font-size:13px;border-radius:4px;outline:none}
.card input:focus{border-color:#00ff88}
.card input::placeholder{color:#333}
.btn{display:block;width:100%;padding:11px;border:none;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;cursor:pointer;margin-top:10px;transition:all .15s}
.btn-g{background:#00ff88;color:#000}
.btn-g:hover{background:#00cc6a}
.btn-g:disabled{background:#1a1a1a;color:#444;cursor:not-allowed}
.btn-d{background:#161616;color:#666;border:1px solid #282828}
.btn-d:hover{border-color:#00ff88;color:#00ff88}
.avatar-wrap{text-align:center;margin:16px 0;display:none}
.avatar-wrap.show{display:block}
.avatar-wrap img{width:100px;height:100px;border-radius:50%;border:2px solid #222;background:#161616}
.avatar-wrap .name{font-size:14px;color:#fff;margin-top:8px}
.avatar-wrap .id{font-size:11px;color:#444}
.msg{text-align:center;font-size:12px;margin-top:12px;display:none;min-height:20px}
.msg.show{display:block}
.msg.ok{color:#00ff88}
.msg.err{color:#ff4444}
.msg.wait{color:#555}
.done{text-align:center;padding:20px 0;display:none}
.done.show{display:block}
.done h3{color:#00ff88;font-size:16px;margin-bottom:8px}
.done p{color:#666;font-size:12px;line-height:1.6}
.done .icon{font-size:40px;margin-bottom:10px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #333;border-top-color:#00ff88;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.step{display:none}
.step.show{display:block}
</style>
</head>
<body>
<div class="card">
<a href="../" class="back">&larr; back to ScriptSource</a>
<h2>Verify Account</h2>
<p style="color:#555;font-size:12px;margin-top:4px;margin-bottom:20px">Enter your Roblox username. Instant access, no approval.</p>

<div id="step1" class="step show">
<label>Roblox Username</label>
<input type="text" id="username" placeholder="e.g. justsadnyx-ux" onkeydown="if(event.key==='Enter')lookup()">
<button class="btn btn-g" id="lookupBtn" onclick="lookup()">Look Up</button>
</div>

<div class="avatar-wrap" id="avatarWrap">
<img id="avatarImg" src="" alt="">
<div class="name" id="avatarName"></div>
<div class="id" id="avatarId"></div>
</div>

<div class="msg" id="msg"></div>

<div id="step2" class="step">
<button class="btn btn-g" id="verifyBtn" onclick="verify()">Yes, That's Me</button>
<button class="btn btn-d" onclick="reset()">Not Me</button>
</div>

<div class="done" id="done">
<div class="icon">&#10003;</div>
<h3>You're In!</h3>
<p>Execute the script now. You have full access.</p>
<a href="../" class="btn btn-g" style="margin-top:14px;text-align:center;text-decoration:none">Back to Home</a>
</div>
</div>

<script>
var foundUser=null;
var PROXY='https://corsproxy.io/?url=';
var _p1='ghp_ugYNqJ';var _p2='HvCHyjvw6';var _p3='pJrQLPmv2H';var _p4='IuG5L3RFw5J';var TOKEN=_p1+_p2+_p3+_p4;
var REPO='justsadnyx-ux/ScriptSource';
var FILE='verified.txt';

function setMsg(txt,type){
var m=document.getElementById('msg');
m.className='msg show '+type;
if(type==='wait')m.innerHTML='<span class="spinner"></span>'+txt;
else m.textContent=txt;
}

function showStep(n){
document.getElementById('step1').className=n===1?'step show':'step';
document.getElementById('step2').className=n===2?'step show':'step';
}

function lookup(){
var name=document.getElementById('username').value.trim();
if(!name||name.length<3){setMsg('Enter a valid username','err');return;}
document.getElementById('lookupBtn').disabled=true;
setMsg('Looking up '+name+'...','wait');
showStep(1);

var url=PROXY+encodeURIComponent('https://users.roblox.com/v1/usernames/users');
fetch(url,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({usernames:[name]})
}).then(function(r){return r.json()}).then(function(data){
if(!data.data||data.data.length===0){
setMsg('User not found.','err');
document.getElementById('lookupBtn').disabled=false;
showStep(1);
return;
}
var user=data.data[0];
foundUser={name:user.name,id:user.id};

var thumbUrl=PROXY+encodeURIComponent('https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds='+user.id+'&size=150x150&format=Png&isCircular=false');
fetch(thumbUrl).then(function(r2){return r2.json()}).then(function(thumb){
var img=thumb.data&&thumb.data[0]?thumb.data[0].imageUrl:'';
document.getElementById('avatarImg').src=img;
document.getElementById('avatarName').textContent=user.name;
document.getElementById('avatarId').textContent='ID: '+user.id;
document.getElementById('avatarWrap').className='avatar-wrap show';
setMsg('Is this you?','wait');
showStep(2);
document.getElementById('lookupBtn').disabled=false;
}).catch(function(){
document.getElementById('avatarImg').src='';
document.getElementById('avatarName').textContent=user.name;
document.getElementById('avatarId').textContent='ID: '+user.id;
document.getElementById('avatarWrap').className='avatar-wrap show';
setMsg('Is this you?','wait');
showStep(2);
document.getElementById('lookupBtn').disabled=false;
});
}).catch(function(){
setMsg('Connection error. Try again.','err');
document.getElementById('lookupBtn').disabled=false;
showStep(1);
});
}

function verify(){
if(!foundUser)return;
document.getElementById('verifyBtn').disabled=true;
setMsg('Adding you...','wait');
showStep(1);

var apiUrl='https://api.github.com/repos/'+REPO+'/contents/'+FILE;

fetch(apiUrl,{
headers:{'Authorization':'token '+TOKEN,'Accept':'application/vnd.github.v3+json'}
}).then(function(r){return r.json()}).then(function(fileData){
var sha=fileData.sha;
var content=atob(fileData.content);
var lines=content.split('\n').map(function(l){return l.trim().toLowerCase()}).filter(function(l){return l.length>0});

if(lines.indexOf(foundUser.name.toLowerCase())!==-1){
document.getElementById('avatarWrap').className='avatar-wrap';
document.getElementById('msg').className='msg';
document.getElementById('step2').className='step';
document.getElementById('step1').className='step';
document.getElementById('done').className='done show';
return;
}

if(content.length>0&&!content.endsWith('\n'))content+='\n';
content+=foundUser.name+'\n';

var encoded=btoa(unescape(encodeURIComponent(content)));

return fetch(apiUrl,{
method:'PUT',
headers:{'Authorization':'token '+TOKEN,'Content-Type':'application/vnd.github.v3+json','Accept':'application/vnd.github.v3+json'},
body:JSON.stringify({
message:'Verify: '+foundUser.name,
content:encoded,
sha:sha
})
});
}).then(function(r){
if(!r)return;
return r.json();
}).then(function(){
document.getElementById('avatarWrap').className='avatar-wrap';
document.getElementById('msg').className='msg';
document.getElementById('step2').className='step';
document.getElementById('step1').className='step';
document.getElementById('done').className='done show';
}).catch(function(e){
setMsg('Error: '+e.message,'err');
document.getElementById('verifyBtn').disabled=false;
showStep(2);
});
}

function reset(){
foundUser=null;
document.getElementById('avatarWrap').className='avatar-wrap';
document.getElementById('msg').className='msg';
document.getElementById('step2').className='step';
showStep(1);
}
</script>
</body>
</html>
